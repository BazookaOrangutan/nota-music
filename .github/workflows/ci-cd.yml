name: Build and Deploy Nota Music

on:
  push:
    branches:
      - dev

jobs:
  build-backend:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build backend
        run: |
          cd backend
          mvn clean package

      - name: Copy backend Dockerfile
        uses: actions/upload-artifact@v4
        with:
          name: backend-dockerfile
          path: backend/Dockerfile

      - name: Copy docker-compose
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose
          path: docker-compose.yml

      - name: Copy backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Copy frontend Dockerfile
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dockerfile
          path: frontend/Dockerfile

      - name: Copy frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  deploy:
    name: Deploy to Server via SSH
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-22.04
    steps:
      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

      - name: Download backend Dockerfile
        uses: actions/download-artifact@v4
        with:
          name: backend-dockerfile
          path: backend/

      - name: Download frontend Dockerfile
        uses: actions/download-artifact@v4
        with:
          name: frontend-dockerfile
          path: frontend/

      - name: Download docker-compose
        uses: actions/download-artifact@v4
        with:
          name: docker-compose
          path: ./

      - name: Upload artifacts to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "./*"
          target: "~/nota-music"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB
          port: 22
          script: |
            cd ~/nota-music
            
            cat <<EOF > ~/nota-music/.env
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            EOF
            
            docker-compose down || true
            docker-compose --env-file .env up -d --build